<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Você decide o futuro da IA</title>
</head>
<body>
    <div class="raios-animados" aria-hidden="true"></div>

    <div class="caixa-principal">
        <h1>Você decide o futuro da IA</h1>

        <div id="inicio" class="etapa-inicial">
            <label for="nome-jogador">Digite seu nome:</label>
            <input id="nome-jogador" type="text" maxlength="40" placeholder="Ex: Bryan" />

            <label for="idade-jogador">Digite sua idade:</label>
            <input id="idade-jogador" type="number" min="1" max="120" placeholder="Ex: 16" />

            <button id="iniciar-jogo" type="button">Começar</button>
        </div>

        <div class="caixa-perguntas"></div>
        <div class="caixa-alternativas"></div>
        <div class="caixa-resultado">
            <p class="texto-resultado"></p>
        </div>
        <button id="reiniciar" class="reiniciar" type="button">Jogar novamente</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
